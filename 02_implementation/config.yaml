datasets:
  credit:
    path: data/credit_raw.csv
    target: dpnm
    drop_cols: [ID]
    primary_drift_feature: AGE
  telco:
    path: data/telco_raw.csv
    target: Churn Value
    drop_cols:
      - CustomerID
      - Count
      - Country
      - State
      - City
      - Zip Code
      - Lat Long
      - Latitude
      - Longitude
      - Churn Label
      - Churn Score
      - Churn Reason
      - CLTV
    primary_drift_feature: Monthly Charges
  maintenance:
    path: data/predictive_maintenance.csv
    target: Machine failure
    drop_cols: [UDI, Product ID, TWF, HDF, PWF, OSF, RNF]
    primary_drift_feature: "Tool wear [min]"

split:
  reference_ratio: 0.6
  random_state: 42

models:
  n_estimators: 100
  random_state: 42

detectors:
  ks:
    threshold: 0.05
  psi:
    threshold: 0.25    # industry standard for "significant change"; p99 of pre-drift noise ~0.23
    n_bins: 10
  wasserstein:
    threshold: 0.25    # pre-drift mean on normalised data ~0.12; p99 ~0.24

constraints:
  monitoring_frequency: [10, 50, 100, 500, 1000]
  window_size: [50, 100, 500, 1000]
  reference_size: [100, 500, null]   # null = unlimited (full reference set)

simulation:
  drift_start_ratio: 0.5
  drift_magnitude: 2.0
  repetitions: 5
  drift_types: [sudden, gradual, recurring]

results:
  output_dir: results
